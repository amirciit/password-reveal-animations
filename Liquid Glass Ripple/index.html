<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A liquid glass ripple password reveal animation.">
  <title>Password Reveal Animation — Type 10</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="canvas">
    <section class="glass-card" aria-labelledby="title">
      <div class="badge">TYPE 10 · LIQUID GLASS</div>
      <h1 id="title">Reveal by ripple.</h1>
      <p class="intro">The visibility state blooms through the password field as a soft glass lens, then settles into a clean final state.</p>

      <div class="field-block">
        <div class="field-heading">
          <label for="password">Password</label>
          <span id="stateText">Private</span>
        </div>
        <div id="passwordShell" class="password-shell" aria-busy="false">
          <input id="password" type="password" value="Ripple.Glass10" autocomplete="current-password" spellcheck="false">
          <div id="baseText" class="text-layer base-text" aria-hidden="true"></div>
          <div id="targetText" class="text-layer target-text" aria-hidden="true"></div>
          <span id="ripple" class="ripple" aria-hidden="true"></span>
          <button id="togglePassword" type="button" aria-controls="password" aria-label="Show password" aria-pressed="false">
            <span class="orb" aria-hidden="true"></span>
            <span id="toggleText">Reveal</span>
          </button>
        </div>
      </div>
      <footer>Zero dependencies · Reveal and hide · Reduced-motion aware</footer>
      <span id="liveStatus" class="sr-only" aria-live="polite"></span>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
