<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A standalone demo of the EFS login password reveal animation.">
    <title>Password Reveal Animation — Type 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <section class="login-card" aria-labelledby="login-title">
            <header class="card-header">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img">
                        <path d="M12 3 5.5 5.8v5.3c0 4.1 2.8 7.9 6.5 9.2 3.7-1.3 6.5-5.1 6.5-9.2V5.8L12 3Z" />
                        <path d="M9.5 11.1v-1a2.5 2.5 0 0 1 5 0v1M9 11.1h6v4.4H9z" />
                    </svg>
                </div>
                <p class="eyebrow">EFS login · interaction demo</p>
                <h1 id="login-title">Welcome back</h1>
                <p class="intro">Enter the demo account and reveal the password to preview the animation.</p>
            </header>

            <div class="login-form" role="group" aria-label="Demo sign-in controls">
                <div class="form-field">
                    <label for="email">Email address</label>
                    <input
                        id="email"
                        type="email"
                        value="demo@efs.local"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="form-field">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <span>Use the eye button to reveal</span>
                    </div>

                    <div id="passwordShell" class="password-shell" data-state="hidden" aria-busy="false">
                        <div class="password-viewport">
                            <input
                                id="password"
                                type="password"
                                value="Secure@2026"
                                autocomplete="off"
                                spellcheck="false"
                                required
                            >
                            <span id="scrambleText" class="scramble-text" aria-hidden="true"></span>
                        </div>

                        <button
                            id="togglePassword"
                            class="toggle-password"
                            type="button"
                            aria-label="Show password"
                            aria-controls="password"
                            aria-pressed="false"
                        >
                            <span class="icon-stack" aria-hidden="true">
                                <svg class="eye-icon" viewBox="0 0 24 24">
                                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                                    <circle cx="12" cy="12" r="2.7" />
                                </svg>
                                <svg class="eye-off-icon" viewBox="0 0 24 24">
                                    <path d="m3 3 18 18" />
                                    <path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c6 0 9.5 6 9.5 6a15 15 0 0 1-2.1 2.8M6.5 6.6C3.9 8.3 2.5 12 2.5 12s3.5 6 9.5 6a9.7 9.7 0 0 0 3.2-.5" />
                                    <path d="M10.1 10.1a2.7 2.7 0 0 0 3.8 3.8" />
                                </svg>
                            </span>
                        </button>
                    </div>

                    <p id="passwordMessage" class="password-message" role="status" aria-live="polite" aria-hidden="true">
                        <span class="status-dot" aria-hidden="true"></span>
                        <span class="message-text"></span>
                    </p>
                    <span id="liveAnnouncement" class="sr-only" aria-live="polite"></span>
                </div>

                <div class="form-options">
                    <label class="remember-option">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>
                    <button id="forgotPassword" class="text-button" type="button">Forgot password?</button>
                </div>

                <button id="demoSubmit" class="submit-button" type="button">Sign in</button>
            </div>

            <p class="demo-note">
                <span aria-hidden="true">●</span>
                Demo only — credentials never leave this page
            </p>
        </section>
    </main>

    <div id="demoToast" class="demo-toast" role="status" aria-live="polite" aria-hidden="true"></div>

    <script src="script.js"></script>
</body>
</html>
